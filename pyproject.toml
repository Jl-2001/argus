[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argus"
version = "0.1.0"
description = "Deterministic infrastructure monitoring substrate for a personal environment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.1,<8",
    "anthropic>=0.40,<1",
    "google-genai>=2.19,<3",
    "httpx>=0.27",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
argus = "argus.cli.main:main"
argus-api = "argus.api.app:run"
argus-agent = "argus.agent.app:run"

[tool.setuptools.packages.find]
include = ["argus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: end-to-end tests against a real, disposable Docker stack (argus-test-stack)",
    "docker: tests that talk to a real Docker daemon",
    "ai: tests that make a real Anthropic API call (skipped unless ANTHROPIC_API_KEY is set)",
]
